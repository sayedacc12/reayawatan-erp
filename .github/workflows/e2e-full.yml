# كل اختبارات التكامل، ملفًا ملفًا (تتشارك قاعدة بيانات واحدة). أسبوعيًا ويدويًا لتوفير دقائق GitHub.
name: e2e-full

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 5'   # الجمعة 4 فجرًا بتوقيت الرياض

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: erp, POSTGRES_PASSWORD: erp, POSTGRES_DB: charity_erp_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U erp -d charity_erp_test" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://erp:erp@localhost:5432/charity_erp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Run each spec on its own
        run: |
          fail=0
          for f in test/*.e2e-spec.ts test/security/*.spec.ts; do
            echo "::group::$f"
            npx jest "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
