server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://rw-backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # أجهزة البصمة (الإرسال التلقائي ADMS) تتصل على المسار الثابت /iclock
  location /iclock/ {
    proxy_pass http://rw-backend:3000/api/hr/iclock/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # صفحات HTML تُراجع مع الخادم في كل زيارة، حتى لا يعرض المتصفح نسخة قديمة بعد التحديث
  # صفحات الموقع العام لها ملفات HTML مولدة عند البناء (seo-prerender.ts) بعنوانها ووصفها،
  # وباقي المسارات (شاشات النظام والبوابات) تأخذ الواجهة العامة _spa.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /_spa.html;
  }

  location = /_spa.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
