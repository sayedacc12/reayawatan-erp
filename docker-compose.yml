# تشغيل النظام كاملًا: docker compose up -d --build  ثم افتح http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: charity_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d charity_erp"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://erp:${DB_PASSWORD:-erp}@db:5432/charity_erp
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # تشفير مفتاح الجمعية وأسرار شهادتها في الربط مع «فاتورة» (يُنشئه deploy/setup.sh تلقائيًا)
      ZATCA_KEY_SECRET: ${ZATCA_KEY_SECRET:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-platform@example.org}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # البريد الصادر (SMTP). تُضبط بالأمر: bash deploy/mail-setup.sh
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # لبناء الروابط في الرسائل: https://<DOMAIN>
      DOMAIN: ${DOMAIN:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  uploads:
