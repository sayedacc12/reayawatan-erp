# نظام رعاية وطن (الموقع ولوحة التحكم ونظام الشركة) — التشغيل المحلي: docker compose up -d --build ثم افتح http://localhost:8080
# أسماء الخدمات تبدأ بـ rw- لأن النظام يعمل على سيرفر مشترك مع أنظمة أخرى.
services:
  rw-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reayawatan
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp}
    volumes:
      - rw-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d reayawatan"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  rw-backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://erp:${DB_PASSWORD:-erp}@rw-db:5432/reayawatan
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ZATCA_KEY_SECRET: ${ZATCA_KEY_SECRET:-}
      # نظام شركة واحدة: المنشأة ومديرها يُنشآن عند أول تشغيل
      COMPANY_SLUG: ${COMPANY_SLUG:-reayawatan}
      COMPANY_NAME: ${COMPANY_NAME:-رعاية وطن}
      DIRECTOR_NAME: ${DIRECTOR_NAME:-مدير المنظمة}
      DIRECTOR_EMAIL: ${DIRECTOR_EMAIL:-}
      DIRECTOR_USERNAME: ${DIRECTOR_USERNAME:-director}
      # تُمرَّر عند أول تشغيل فقط من deploy/setup.sh (لا تُحفظ في .env)
      DIRECTOR_PASSWORD: ${DIRECTOR_PASSWORD:-}
      DIRECTOR_PASSWORD_TEMPORARY: ${DIRECTOR_PASSWORD_TEMPORARY:-}
      # البريد الصادر (SMTP). تُضبط بالأمر: bash deploy/mail-setup.sh
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # لبناء الروابط في الرسائل: https://<DOMAIN>
      DOMAIN: ${DOMAIN:-}
    volumes:
      - rw-uploads:/app/uploads
    depends_on:
      rw-db:
        condition: service_healthy
    restart: unless-stopped

  rw-frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - rw-backend
    restart: unless-stopped

volumes:
  rw-db-data:
  rw-uploads:
