# إعدادات الإنتاج: Caddy أمام النظام ويصدر شهادة HTTPS تلقائيًا للدومين.
# التشغيل: docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d --build
services:
  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
