# إنتاج رعاية وطن على السيرفر المشترك: لا Caddy خاص ولا منافذ مفتوحة.
# Caddy الخاص بسنابل يصل إلى rw-frontend عبر الشبكة المشتركة caddy-edge (ملف deploy/reayawatan.caddy يُنسخ إلى deploy/sites في سنابل).
# التشغيل (من deploy/setup.sh): docker compose -p rw -f docker-compose.yml -f deploy/compose.prod.yml up -d --build
services:
  rw-backend:
    environment:
      # Caddy ثم nginx أمام الخادم: وسيطان موثوقان لمعرفة عنوان الزائر الحقيقي (للحد من المحاولات في نماذج الموقع)
      TRUST_PROXY: "2"

  rw-frontend:
    ports: !reset []
    networks:
      - default
      - edge

  # قاعدة البيانات على الشبكة الداخلية فقط، ولا تنضم إلى caddy-edge أبدًا
  rw-db:
    networks:
      - default

networks:
  edge:
    name: caddy-edge
    external: true
