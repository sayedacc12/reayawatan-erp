# إعدادات الإنتاج: Caddy أمام النظام ويصدر شهادة HTTPS تلقائيًا للدومين.
# التشغيل: docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d --build
services:
  backend:
    environment:
      # Caddy ثم nginx أمام الخادم: وسيطان موثوقان لمعرفة عنوان العميل الحقيقي
      TRUST_PROXY: "2"

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2.11.9-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # مواقع إضافية على نفس السيرفر: إعداداتها (*.caddy) وملفاتها الثابتة. انظر deploy/sites/README.md
      - ./deploy/sites:/etc/caddy/sites:ro
    networks:
      - default
      - edge
    depends_on:
      - frontend
    restart: unless-stopped

networks:
  # شبكة يشترك فيها Caddy مع أنظمة أخرى على نفس السيرفر (تنضم إليها كشبكة external باسم caddy-edge)
  edge:
    name: caddy-edge

volumes:
  caddy-data:
  caddy-config:
